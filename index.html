<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0xceased</title>
    <meta name="description" content="My personal portfolio">
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Landing Screen -->
    <div id="landing-screen" class="landing-screen">
        <div class="enter-button">
            <span class="highlight">Click to Enter</span>
        </div>
    </div>

    <!-- Main Content (initially hidden) -->
    <div id="main-content-wrapper" class="hidden">
        <div class="container">
            <!-- Social Links Sidebar -->
            <div class="social-sidebar">
                <div class="follow-text">Follow Me</div>
                <div class="social-links">
                    <a href="#instagram" aria-label="Instagram">
                        <i class="fab fa-instagram"></i>
                    </a>
                    <a href="#discord" aria-label="Discord">
                        <i class="fab fa-discord"></i>
                    </a>
                </div>
            </div>

            <!-- Main Content -->
            <main class="main-content">
                <div class="centered-content">
                    <h2 class="subtitle">
                        <span class="highlight">0xceased</span>
                    </h2>
                    
                    <div class="image-container">
                        <div class="profile-image">
                            <img 
                                src="profile-image.png" 
                                alt="Profile" 
                                width="400" 
                                height="400"
                                class="glow-effect"
                            >
                        </div>
                    </div>

                    <!-- Navigation links -->
                    <div class="nav-links">
                        <a href="index.html">Home</a>
                        <a href="about.html">About Me</a>
                        <a 
                            href="https://www.instagram.com/0xceased/" 
                            target="_blank" 
                            rel="noopener noreferrer"
                        >
                            Instagram
                        </a>
                    </div>
                </div>
            </main>
        </div>

        <div id="shooting-stars-container"></div>
    </div>

    <!-- Audio Element -->
    <audio id="background-music" loop>
        <source src="background-music.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
